<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dungeon Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf2f7;font-family:ui-monospace,Consolas,monospace;display:flex;justify-content:center;min-height:100vh}.wrap{width:min(100%,1000px);padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#202b39;border:1px solid #405168;border-radius:9px;padding:8px 12px}.bar{height:10px;background:#394454;border-radius:8px;overflow:hidden;margin-top:5px;width:180px}.fill{height:100%;background:#e45b65;width:100%;transition:width .15s}canvas{display:block;width:100%;height:auto;background:#202b2b;border:2px solid #657383;border-radius:2px;box-shadow:0 12px 40px #0008;image-rendering:pixelated}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;color:#c5d0dc;font-size:14px}.hint{background:#202b39;padding:10px 13px;border-radius:9px}.overlay{position:fixed;inset:0;background:#070b10c9;display:grid;place-items:center;padding:20px}.panel{background:#202b39;border:1px solid #64758a;border-radius:16px;padding:26px;max-width:440px;text-align:center;box-shadow:0 20px 70px #0009}.panel h2{margin-top:0}.panel button{background:#e2b65d;color:#171b20;border:0;border-radius:9px;padding:11px 22px;font-weight:bold;font-size:16px;cursor:pointer}.hidden{display:none}

.overlay{z-index:20;overflow:auto}.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}.modes button{background:#2b3a4d!important;color:#edf2f7!important;border:2px solid #405168!important;padding:10px 14px!important;font-size:15px!important}.modes button.sel{background:#e2b65d!important;color:#171b20!important;border-color:#e2b65d!important}#modeHint{font-size:13px;color:#aebdca;margin:6px 0 10px}
#touchUI{position:fixed;inset:0;z-index:10;pointer-events:none;touch-action:none}#joyZone{position:absolute;left:0;top:0;width:55%;height:100%;pointer-events:auto;touch-action:none}
.joyBase{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);pointer-events:none}.joyKnob{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(226,182,93,.65);border:2px solid rgba(255,255,255,.6);pointer-events:none}
.tbtn{position:fixed;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;font-weight:bold;color:#fff;background:rgba(40,60,90,.55);border:3px solid rgba(255,255,255,.5);user-select:none;-webkit-user-select:none}#btnSword{right:26px;bottom:34px;width:98px;height:98px;font-size:22px}#btnBow{right:138px;bottom:92px;width:80px;height:80px;font-size:19px}.tbtn.on{background:rgba(226,182,93,.75)}
body.mobile{touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}body.mobile .wrap{padding:4px;width:100%}body.mobile .top{margin-bottom:4px;gap:6px}body.mobile .top h2,body.mobile .top small{display:none}body.mobile .pill{padding:4px 8px;font-size:12px}body.mobile .bar{width:100px}body.mobile canvas{width:auto;max-width:100%;max-height:calc(100vh - 52px);margin:0 auto}body.mobile .bottom{margin:0}body.mobile .hint:not(#message){display:none}body.mobile #message{position:fixed;top:46px;left:50%;transform:translateX(-50%);z-index:6;font-size:12px;padding:4px 10px;background:#202b39cc;pointer-events:none;max-width:70%;text-align:center}
</style></head><body><div class="wrap"><div class="top"><div><h2 style="margin:0 0 4px">⚔ DUNGEON ADVENTURE</h2><small style="color:#aebdca">HP100 / 移動速度100 / 剣・弓ダメージ5</small></div><div class="stats"><div class="pill">階層 <b id="floor">1</b> / 13</div><div class="pill">敵残り <b id="left">0</b></div><div class="pill">HP <b id="hpText">100 / 100</b><div class="bar"><div class="fill" id="hpFill"></div></div></div><div class="pill">撃破数 <b id="kills">0</b></div></div></div><canvas id="game" width="900" height="600"></canvas><div class="bottom"><div class="hint">移動：<b>W A S D</b>　剣：<b>J</b>　弓：<b>K</b></div><div class="hint">剣：射程2　弓：射程10（HPが最も少ない敵を狙う）</div><div class="hint" id="message">敵を倒そう！</div></div></div>
<div id="touchUI" class="hidden"><div id="joyZone"></div><div class="joyBase" id="joyBase"></div><div class="joyKnob" id="joyKnob"></div><div class="tbtn" id="btnBow">弓</div><div class="tbtn" id="btnSword">剣</div></div>
<div class="overlay" id="overlay"><div class="panel"><h2 id="panelTitle">ダンジョンへようこそ</h2><p id="panelText">第1〜13層まで遊べます。<br>各階層の敵を倒して階段を目指そう！11層クリアでHP全回復。</p><div class="modes"><button data-mode="pc">🖥 PC（キーボード）</button><button data-mode="mobile">📱 モバイル（タッチ）</button></div><div id="modeHint"></div><p style="margin:10px 0"><label>開始階層：<select id="startFloor"><option value="1">1層から（通常）</option><option value="11">11層（スライム王）</option><option value="12">12層（ジャイアントゾンビ）</option><option value="13">13層（サボテン）</option></select></label></p><button id="start">冒険を始める</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');const W=c.width,H=c.height;
const keys={};let player,enemies,arrows,enemyShots,hazards=[],particles,floor=1,kills=0,gameOn=false, swordTime=0,bowCD=0,stair=null,last=0,spawnCount=0;
const ui=id=>document.getElementById(id);const rand=(a,b)=>Math.random()*(b-a)+a;const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resetPlayer(){player={x:W/2,y:H/2,r:13,hp:100,max:100,speed:150,inv:0,face:0,moveX:0,moveY:0,attack:0,bow:0};}

const ENEMY_STATS={slime:{hp:10,speed:50,damage:3,range:32,r:15},skeleton:{hp:10,speed:85,damage:8,range:320,r:14},zombie:{hp:15,speed:40,damage:6,range:64,r:16},ghost:{hp:15,speed:120,damage:3,range:30,r:15}};
const FLOOR_PLANS={1:[{slime:4}],2:[{slime:3,zombie:3}],4:[{slime:5},{skeleton:2,zombie:3}],5:[{slime:3,skeleton:4},{zombie:6,skeleton:2}],7:[{slime:3,zombie:3,skeleton:2},{slime:8,skeleton:2}],8:[{ghost:5},{ghost:4,skeleton:3}],9:[{ghost:8,skeleton:2}]};
let phaseQueue=[];const CELL=32,SLAM_R=100,SLAM_Z=280;
const isBoss=e=>e.type==='pumpkinBoss'||e.type==='melonBoss'||e.type==='ghostKing'||e.type==='slimeKing'||e.type==='giantZombie'||e.type==='cactusBoss';
function makeEnemy(type,x,y){const st=ENEMY_STATS[type];return{type,atkT:0,x,y,r:st.r,hp:st.hp,max:st.hp,speed:st.speed,damage:st.damage,range:st.range,hit:0,phase:rand(0,6),attackCD:rand(.2,1.1),facing:0};}
function spawnGroup(g){for(const type in g)for(let i=0;i<g[type];i++){let x,y,n=0;do{x=rand(65,W-65);y=rand(65,H-65);n++}while(Math.hypot(x-player.x,y-player.y)<170&&n<60);enemies.push(makeEnemy(type,x,y));}}
function nextPhase(){const g=phaseQueue.shift();enemyShots=[];spawnGroup(g);const n=FLOOR_PLANS[floor].length-phaseQueue.length;ui('message').textContent='第'+n+'フェーズ！新たな敵が現れた！';for(const e of enemies)burst(e.x,e.y,'#cfa6ff',12);updateUI();}
function knockPlayer(sx,sy,cells){let ang=Math.atan2(player.y-sy,player.x-sx);if(Math.hypot(player.x-sx,player.y-sy)<1)ang=rand(0,Math.PI*2);const px=cells*CELL,T=.16;player.kb={vx:Math.cos(ang)*px/T,vy:Math.sin(ang)*px/T,t:T};}
function updateSkeleton(e,dt,a,d){const R=e.range,near=R*.86,far=R*.97;let mx=0,my=0,sp=e.speed;if(d<near){mx=-Math.cos(a);my=-Math.sin(a);sp=e.speed*1.35;const m=36,bx=(e.x<=m&&mx<0)||(e.x>=W-m&&mx>0),by=(e.y<=m&&my<0)||(e.y>=H-m&&my>0);if(bx&&by){mx=-Math.sin(a);my=Math.cos(a);if(mx*(W/2-e.x)+my*(H/2-e.y)<0){mx=-mx;my=-my;}}else if(bx){mx=0;my=player.y<e.y?1:-1;}else if(by){my=0;mx=player.x<e.x?1:-1;}}else if(d>far){mx=Math.cos(a);my=Math.sin(a);}
e.x+=mx*sp*dt;e.y+=my*sp*dt;e.x=Math.max(30,Math.min(W-30,e.x));e.y=Math.max(30,Math.min(H-30,e.y));
if(e.atkT>0){e.atkT-=dt;if(e.atkT<=0){let aa=Math.atan2(player.y-e.y,player.x-e.x);enemyShots.push({x:e.x+Math.cos(aa)*15,y:e.y+Math.sin(aa)*15,vx:Math.cos(aa)*250,vy:Math.sin(aa)*250,life:R/250,damage:e.damage});}}else if(d<=R&&e.attackCD<=0){e.atkT=ATK_DUR.skeleton;e.attackCD=1.7;}}
function updateMelon(e,dt){e.anim+=dt;e.flash=Math.max(0,e.flash-dt);e.shock=Math.max(0,e.shock-dt);const x0=12+e.r,x1=W-12-e.r,y0=12+e.r,y1=H-12-e.r;
if(e.mode!=='roll')e.rot*=Math.max(0,1-dt*8);
if(e.mode==='normal'){e.z=0;e.skillCD-=dt;let tx=W/2+Math.sin(e.anim*.7)*250,ty=170+Math.sin(e.anim*1.2)*40,dx=tx-e.x,dy=ty-e.y,dd=Math.hypot(dx,dy),st=Math.min(dd,130*dt);if(dd>1){e.x+=dx/dd*st;e.y+=dy/dd*st;}
if(e.skillCD<=0){if(e.specialIndex===0){e.mode='rollWind';e.t=1.0;e.specialIndex=1;e.flash=.4;burst(e.x,e.y,'#7cff6a',16);ui('message').textContent='ボス攻撃①：転がるスイカ！';}else{e.mode='slam';e.sub='jump';e.t=.4;e.slams=0;e.specialIndex=0;e.flash=.4;burst(e.x,e.y,'#ff8a6a',16);ui('message').textContent='ボス攻撃②：ヒップドロップ！';}}}
else if(e.mode==='rollWind'){e.t-=dt;if(e.t>.35)e.rollA=Math.atan2(player.y-e.y,player.x-e.x);if(e.t<=0){e.mode='roll';e.rollT=4.5;e.vx=Math.cos(e.rollA)*640;e.vy=Math.sin(e.rollA)*640;}}
else if(e.mode==='roll'){e.rollT-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;let bounced=false;if(e.x<x0){e.x=x0;e.vx=Math.abs(e.vx);bounced=true;}if(e.x>x1){e.x=x1;e.vx=-Math.abs(e.vx);bounced=true;}if(e.y<y0){e.y=y0;e.vy=Math.abs(e.vy);bounced=true;}if(e.y>y1){e.y=y1;e.vy=-Math.abs(e.vy);bounced=true;}if(bounced)burst(e.x,e.y,'#7cff6a',8);e.rot+=(Math.hypot(e.vx,e.vy)/e.r)*dt*(e.vx>=0?1:-1);
if(player.inv<=0&&Math.hypot(player.x-e.x,player.y-e.y)<e.r+player.r){player.hp-=10;player.inv=.55;knockPlayer(e.x,e.y,2);burst(player.x,player.y,'#e76b70',10);}
if(Math.random()<.6)particles.push({x:e.x,y:e.y+e.r*.8,vx:rand(-40,40),vy:rand(-40,0),life:.3,max:.55,color:'#4cc04a'});
if(e.rollT<=0){e.mode='normal';e.skillCD=2.5;}}
else if(e.mode==='slam'){e.t-=dt;
if(e.sub==='jump'){let k=Math.min(1,1-e.t/.4);e.z=SLAM_Z*Math.sin(k*Math.PI/2);if(e.t<=0){e.sub='track';e.t=.6;e.z=SLAM_Z;}}
else if(e.sub==='track'){let dx=player.x-e.x,dy=player.y-e.y,dd=Math.hypot(dx,dy),st=Math.min(dd,380*dt);if(dd>1){e.x+=dx/dd*st;e.y+=dy/dd*st;}if(e.t<=0){e.sub='lock';e.t=.4;}}
else if(e.sub==='lock'){if(e.t<=0){e.sub='fall';}}
else if(e.sub==='fall'){e.z-=SLAM_Z/.55*dt;if(e.z<=0){e.z=0;e.sub='land';e.t=.4;e.shock=.4;burst(e.x,e.y,'#ff9a2f',24);if(player.inv<=0&&Math.hypot(player.x-e.x,player.y-e.y)<SLAM_R+player.r*.5){player.hp-=12;player.inv=.55;knockPlayer(e.x,e.y,3);burst(player.x,player.y,'#e76b70',12);}}}
else if(e.sub==='land'){if(e.t<=0){e.slams++;if(e.slams<4){e.sub='jump';e.t=.4;}else{e.mode='normal';e.sub='';e.skillCD=2.5;}}}}}
function drawBossTele(){for(const e of enemies){if(e.type!=='melonBoss')continue;const pl=.5+.5*Math.sin(performance.now()/60);
if(e.mode==='rollWind'){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rollA);ctx.fillStyle='rgba(255,40,40,'+(.12+.16*pl)+')';ctx.fillRect(0,-e.r,1100,e.r*2);ctx.fillStyle='rgba(255,90,90,.7)';ctx.fillRect(0,-e.r,1100,2);ctx.fillRect(0,e.r-2,1100,2);ctx.restore();}
if(e.mode==='slam'&&(e.sub==='track'||e.sub==='lock'||e.sub==='fall')){const lk=e.sub!=='track';ctx.fillStyle='rgba(255,40,40,'+(lk?.2+.15*pl:.1)+')';ctx.beginPath();ctx.arc(e.x,e.y,SLAM_R,0,Math.PI*2);ctx.fill();if(e.sub==='fall'){const k=1-e.z/SLAM_Z;ctx.fillStyle='rgba(255,60,60,.35)';ctx.beginPath();ctx.arc(e.x,e.y,SLAM_R*k,0,Math.PI*2);ctx.fill();}ctx.strokeStyle='rgba(255,90,90,'+(lk?.95:.5)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,SLAM_R,0,Math.PI*2);ctx.stroke();}
if(e.shock>0){const f=e.shock/.4;ctx.strokeStyle='rgba(255,170,60,'+f+')';ctx.lineWidth=6;ctx.beginPath();ctx.arc(e.x,e.y,SLAM_R*(1.35-f*.35),0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,140,40,'+(f*.3)+')';ctx.beginPath();ctx.arc(e.x,e.y,SLAM_R,0,Math.PI*2);ctx.fill();}}}
function drawMelon(e){const z=e.z||0,ox=e.x,oy=e.y-z,r=e.r,flash=e.hit||e.flash>0;const sh=1/(1+z/260);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(e.x,e.y+r*.75,r*sh*1.05,r*.32*sh,0,0,Math.PI*2);ctx.fill();
if(e.mode!=='normal'){ctx.globalAlpha=.2+.12*Math.sin(e.anim*10);ctx.fillStyle=e.mode==='slam'?'#ff5a4a':'#7cff6a';ctx.beginPath();ctx.arc(ox,oy,r*1.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
const shake=e.mode==='rollWind'?Math.sin(e.anim*70)*3:0;ctx.save();ctx.translate(ox+shake,oy);ctx.rotate(e.rot||0);
ctx.fillStyle=flash?'#fff0b0':'#2e8b3d';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.clip();ctx.fillStyle=flash?'#ffe08a':'#1d6a2b';for(let i=-4;i<=4;i++)ctx.fillRect(i*12-3,-r,6,r*2);ctx.restore();
ctx.strokeStyle='#124a1e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
ctx.fillStyle='#f4f4ea';ctx.fillRect(-21,-13,14,13);ctx.fillRect(7,-13,14,13);ctx.fillStyle=e.mode==='slam'?'#ff3a2a':'#c8202a';ctx.fillRect(-16,-9,7,8);ctx.fillRect(9,-9,7,8);
ctx.fillStyle='#0f2f16';ctx.beginPath();ctx.moveTo(-24,-22);ctx.lineTo(-4,-14);ctx.lineTo(-4,-18);ctx.lineTo(-24,-27);ctx.fill();ctx.beginPath();ctx.moveTo(24,-22);ctx.lineTo(4,-14);ctx.lineTo(4,-18);ctx.lineTo(24,-27);ctx.fill();
ctx.fillStyle='#d92c3a';ctx.fillRect(-17,10,34,11);ctx.fillStyle='#111';ctx.fillRect(-10,13,4,5);ctx.fillRect(-2,13,4,5);ctx.fillRect(6,13,4,5);
ctx.restore();}

const SWING=.2,SWORD_CD=.1,ATK_DUR={slime:.3,zombie:.4,skeleton:.35,ghost:.3},KHW=60,KHH=85;
let souls=[];
const immune=e=>e.z>30||e.untarget;
function bossTouch(e){if(!isBoss(e)||!e.touch||immune(e)||e.mode==='roll'||e.mode==='cross'||e.mode==='crossWind'||e.mode==='charge')return;if(player.inv<=0&&Math.hypot(player.x-e.x,player.y-e.y)<e.r+player.r){player.hp-=e.touch;player.inv=.55;burst(player.x,player.y,'#e76b70',8);}}
function updateMelee(e,dt,a,d){if(e.pulled)return;if(e.atkT>0){e.atkT-=dt;if(e.atkT<=0&&player.inv<=0&&Math.hypot(player.x-e.x,player.y-e.y)<=e.range+e.r*.6+4){player.hp-=e.damage;player.inv=.55;burst(player.x,player.y,e.type==='slime'?'#e76b70':e.type==='ghost'?'#bfe8ff':'#83a65c',5);}return;}
if(d>e.range){let aa=e.type==='ghost'?a+Math.sin(e.phase*3.5)*.5:a;e.x+=Math.cos(aa)*e.speed*dt;e.y+=Math.sin(aa)*e.speed*dt;}else if(e.attackCD<=0){e.atkT=ATK_DUR[e.type];e.attackCD=e.type==='slime'?1.05:e.type==='ghost'?.9:1.25;}}
function atkK(e){return e.atkT>0&&ATK_DUR[e.type]?1-e.atkT/ATK_DUR[e.type]:-1;}
function applyAtk(e){const k=atkK(e);if(k<0)return;const fx=Math.cos(e.facing),fy=Math.sin(e.facing);let ox=0,oy=0,sx=1,sy=1;
if(e.type==='slime'){if(k<.6){const w=k/.6;sx=1+.25*w;sy=1-.3*w;}else{const l=Math.sin((k-.6)/.4*Math.PI);ox=fx*l*20;oy=fy*l*20-l*8;sx=1-.15*l;sy=1+.2*l;}}
else if(e.type==='zombie'){if(k<.5){oy=-2*k/.5;sy=1+.06*k/.5;}else{const l=Math.sin((k-.5)/.5*Math.PI);ox=fx*l*9;oy=fy*l*9;}}
else if(e.type==='skeleton'){const l=Math.sin(k*Math.PI);ox=-fx*l*3;oy=-fy*l*3;}
const by=e.y+e.r;ctx.translate(e.x+ox,by+oy);ctx.scale(sx,sy);ctx.translate(-e.x,-by);}
function drawAtkOverlay(e){const k=atkK(e);
if(e.type==='skeleton'){ctx.save();ctx.translate(e.x,e.y-2);ctx.rotate(e.facing);const pull=k>=0?Math.min(1,k/.8)*7:0,bx=18.35;ctx.strokeStyle='#b98b50';ctx.lineWidth=3;ctx.beginPath();ctx.arc(14,0,12,-1.2,1.2);ctx.stroke();ctx.strokeStyle='#f1dfb8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx,-11.2);ctx.lineTo(bx-pull,0);ctx.lineTo(bx,11.2);ctx.stroke();if(k>=0){ctx.fillStyle='#e8dfc7';ctx.fillRect(bx-pull,-1,18,2);ctx.fillStyle='#ff5a4a';ctx.fillRect(bx-pull+16,-3,4,6);}ctx.restore();}
else if(e.type==='zombie'&&k>=0){const fx=Math.cos(e.facing),fy=Math.sin(e.facing);let len,oy;if(k<.5){len=8+k/.5*6;oy=-10;}else{const l=(k-.5)/.5;len=14+Math.sin(l*Math.PI/2)*20;oy=-10+l*8;}ctx.strokeStyle='#6f8f55';ctx.lineWidth=5;for(const sd of[-1,1]){const sx0=e.x-fy*7*sd,sy0=e.y+oy*(k<.5?1:.4)+fx*7*sd*.5;ctx.beginPath();ctx.moveTo(sx0,sy0);ctx.lineTo(sx0+fx*len,sy0+fy*len+(k<.5?-6:0));ctx.stroke();}if(k>=.5){const l=(k-.5)/.5;ctx.strokeStyle='rgba(200,255,160,'+(.7*(1-l))+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,30+l*8,e.facing-.7,e.facing+.7);ctx.stroke();}}
else if(e.type==='slime'&&k>=0&&k<.6){ctx.fillStyle='rgba(255,80,80,'+(.3*k/.6)+')';ctx.fillRect(e.x-e.r+3,e.y-e.r+5,(e.r-3)*2,e.r*2-4);}}
function drawGhost(e){const king=e.type==='ghostKing',u=e.r,k=atkK(e),fx=Math.cos(e.facing||0),fy=Math.sin(e.facing||0);let ox=0,oy=Math.sin((e.anim!==undefined?e.anim:e.phase)*(king?2.5:4))*3,open=0;
if(!king&&k>=0){if(k<.5){ox=-fx*5*k/.5;oy-=fy*5*k/.5;open=k/.5*.6;}else{const o=Math.sin((k-.5)/.5*Math.PI)*22;ox=fx*o;oy+=fy*o;open=1;}}
let alpha=king?(e.vis===undefined?1:e.vis)*.93:(.78+.12*Math.sin(e.phase*6));if(e.hit)alpha=1;const x=e.x+ox,y=e.y+oy,flash=e.hit||e.flash>0;
ctx.save();ctx.globalAlpha=alpha;
ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(e.x,e.y+u+8,u*.8,u*.25,0,0,Math.PI*2);ctx.fill();

function update(dt){let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(isMobile&&joy.on){mx=joy.x;my=joy.y;}if(isMobile&&gameOn){if(tbtn.sword)sword();if(tbtn.bow)shoot();}if(mx||my){let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;}player.face=Math.atan2(my,mx);}player.moveX=mx;player.moveY=my;const psp=player.speed-(stickyT>0?80:0);player.x+=mx*psp*dt;player.y+=my*psp*dt;if(player.kb){let kd=Math.min(dt,player.kb.t);player.x+=player.kb.vx*kd;player.y+=player.kb.vy*kd;player.kb.t-=dt;if(player.kb.t<=0)player.kb=null;}player.x=Math.max(24,Math.min(W-24,player.x));player.y=Math.max(24,Math.min(H-24,player.y));player.inv=Math.max(0,player.inv-dt);player.attack=Math.max(0,player.attack-dt);player.bow=Math.max(0,player.bow-dt);swordTime=Math.max(0,swordTime-dt);bowCD=Math.max(0,bowCD-dt);
